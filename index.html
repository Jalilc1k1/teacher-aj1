<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B1418">
<meta name="format-detection" content="telephone=no">
<title>Teacher AJ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="api.js"></script>
<style>
:root{--green:#58CC02;--green-d:#46A302;--blue:#1CB0F6;--blue-d:#1899D6;--red:#FF4B4B;--red-d:#EA2B2B;--yellow:#FFC800;--yellow-d:#E5A800;--purple:#CE82FF;--orange:#FF9600;
--bg:#FFFFFF;--card:#FFFFFF;--bd:#E5E5E5;--tx:#3C3C3C;--tx2:#8A8F93;--lock:#E5E5E5;--lock-d:#CECECE;--soft:#F7F7F7;--shade:rgba(0,0,0,.45)}
[data-theme=dark]{--bg:#131F24;--card:#1A2930;--bd:#2E3E46;--tx:#F1F7FB;--tx2:#8FA1AB;--lock:#37464F;--lock-d:#26333A;--soft:#1F2F37;--shade:rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;padding:0;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--bg);color:var(--tx);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}
#app{position:relative;max-width:540px;margin:0 auto;height:var(--tg-viewport-stable-height,100dvh);display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--bg)}
#fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:60}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;padding:0}
input,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--soft);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;width:100%;outline:none;resize:none}
input:focus,textarea:focus{border-color:var(--blue)}
.tap{transition:transform .1s}.tap:active{transform:scale(.96)}
/* верхняя панель */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:2px solid var(--bd);gap:4px}
.pill{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px;padding:6px 9px;border-radius:12px}
.pill:active{background:var(--soft)}
main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.view{animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
nav{flex:none;display:flex;border-top:2px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--bg)}
nav button{flex:1;font-size:23px;padding:6px 0 4px;border-radius:14px;border:2px solid transparent;line-height:1;filter:grayscale(.5);opacity:.75}
nav button small{display:block;font-size:10px;margin-top:3px;font-weight:800;color:var(--tx2)}
nav button.on{filter:none;opacity:1;background:rgba(28,176,246,.14);border-color:var(--blue)}
nav button.on small{color:var(--blue)}
/* кнопки */
.btn{display:block;width:100%;padding:14px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--bd);box-shadow:0 4px 0 var(--bd)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:13px}
.btn[disabled]{background:var(--lock);color:var(--tx2);box-shadow:0 4px 0 var(--lock-d);pointer-events:none}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin:12px 14px}
.h{font-size:22px;font-weight:900;margin:18px 16px 6px}
.h2{font-size:17px;font-weight:900;margin:0 0 10px}
.muted{color:var(--tx2);font-size:14px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* путь уроков */
.unit{margin:14px 14px 4px;padding:16px;border-radius:18px;color:#fff;position:sticky;top:8px;z-index:4;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:10px}
.unit b{display:block;font-size:18px;font-weight:900}.unit span{font-size:14px;opacity:.95}
.unit .ub{flex:none;background:rgba(255,255,255,.22);border-radius:12px;padding:8px 10px;font-size:20px}
.chap{display:flex;align-items:center;gap:10px;margin:26px 18px 6px;color:var(--tx2);font-weight:900;font-size:14px}
.chap:before,.chap:after{content:'';flex:1;height:2px;background:var(--bd)}
.chap button{color:var(--blue);font-weight:900;font-size:13px;border:2px solid var(--bd);border-radius:12px;padding:4px 10px}
.nw{display:flex;justify-content:center;margin:30px 0 20px}
.node{position:relative;width:72px;height:72px;border-radius:50%;font-size:30px;color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.node:active{transform:translateY(5px)}
.node.lock{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:var(--tx2)}
.node .st{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;letter-spacing:-2px}
.node.cur{animation:pulse 1.6s infinite}
.tip{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--green);border:2px solid var(--bd);border-radius:12px;padding:3px 10px;font-size:13px;font-weight:900;white-space:nowrap;animation:bob 1.3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 rgba(0,0,0,.25),0 0 0 0 rgba(88,204,2,.5)}50%{box-shadow:0 7px 0 rgba(0,0,0,.25),0 0 0 12px rgba(88,204,2,0)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
/* шторка и слои */
.sheet{position:absolute;inset:0;background:var(--shade);display:flex;align-items:flex-end;z-index:40;animation:fade .15s}
.sheet>.sh{background:var(--bg);width:100%;max-height:88%;overflow-y:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--bd);margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.layer{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;animation:slide .22s cubic-bezier(.2,.8,.3,1)}
@keyframes slide{from{transform:translateX(100%)}}
.layer.up{animation:upl .22s cubic-bezier(.2,.8,.3,1)}@keyframes upl{from{transform:translateY(100%)}}
.lhead{flex:none;display:flex;align-items:center;gap:12px;padding:12px 14px}
.lbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 18px 18px}
/* урок */
.bar{flex:1;height:16px;background:var(--lock);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .35s cubic-bezier(.2,.8,.3,1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.28)}
.x{font-size:26px;color:var(--tx2);width:34px}
.q{font-size:24px;font-weight:900;margin:8px 0 18px;line-height:1.25}
.say{flex:none;background:var(--blue);color:#fff;width:52px;height:52px;border-radius:16px;box-shadow:0 4px 0 var(--blue-d);font-size:22px}
.say:active{transform:translateY(4px);box-shadow:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;padding:13px 14px;margin-bottom:10px;font-size:18px;font-weight:800}
.opt .k{flex:none;width:28px;height:28px;border:2px solid var(--bd);border-radius:9px;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.14);color:var(--blue)}.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.ok{border-color:var(--green);background:rgba(88,204,2,.16);color:var(--green)}.opt.bad{border-color:var(--red);background:rgba(255,75,75,.14);color:var(--red)}
.ans,.bank{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;min-height:56px;align-content:flex-start}
.ans{border-bottom:2px solid var(--bd);margin:6px 0 18px;min-height:112px;background:repeating-linear-gradient(transparent 0 54px,var(--bd) 54px 56px)}
.bank{justify-content:center}
.chip{background:var(--card);border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;padding:9px 14px;font-size:17px;font-weight:800;animation:pop .15s}
.chip.used{background:var(--lock);color:transparent;border-color:var(--lock);animation:none}
@keyframes pop{from{transform:scale(.85)}}
.foot{flex:none;padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:2px solid var(--bd)}
.foot.ok{background:rgba(88,204,2,.16);border-color:transparent}.foot.bad{background:rgba(255,75,75,.13);border-color:transparent}
.fb{font-size:19px;font-weight:900;margin-bottom:4px}.foot.ok .fb{color:var(--green)}.foot.bad .fb{color:var(--red)}
.fs{font-size:15px;margin-bottom:12px}
.shake{animation:shake .35s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* статистика */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 14px}
.grid3{grid-template-columns:1fr 1fr 1fr}
.stat{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px;font-size:13px;color:var(--tx2)}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--tx);margin-bottom:2px}
.stat .ic{font-size:20px;margin-bottom:4px}
.stat .delta{color:var(--green);font-size:12px}
.av{font-size:28px;width:46px;height:46px;border-radius:50%;background:var(--soft);border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;flex:none}
.xpb{height:12px;background:var(--lock);border-radius:8px;overflow:hidden;margin:8px 0}.xpb i{display:block;height:100%;border-radius:8px;background:var(--yellow)}
.seg{display:flex;gap:6px;margin:10px 14px;background:var(--soft);border-radius:16px;padding:4px}
.seg button{flex:1;padding:9px 4px;border-radius:12px;font-weight:900;font-size:14px;color:var(--tx2)}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 2px 0 var(--bd)}
.chips{display:flex;gap:8px;margin:8px 14px;overflow-x:auto}
.chips button{flex:none;padding:7px 12px;border-radius:12px;border:2px solid var(--bd);font-weight:800;font-size:13px;color:var(--tx2)}
.chips button.on{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.12)}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:2px solid var(--bd)}
.li:last-child{border-bottom:0}
.li.me{background:rgba(28,176,246,.12)}
.n{width:28px;text-align:center;font-weight:900;color:var(--tx2)}
.badge{display:inline-block;border-radius:9px;padding:2px 8px;font-size:12px;font-weight:900;background:var(--yellow);color:#4b3a00}
.badge.g{background:var(--green);color:#fff}.badge.b{background:var(--blue);color:#fff}.badge.r{background:var(--red);color:#fff}.badge.s{background:var(--soft);color:var(--tx2)}
.hb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.hb .t{width:110px;flex:none;color:var(--tx2)}.hb .tr{flex:1;height:14px;background:var(--soft);border-radius:8px;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:8px}.hb b{width:28px;text-align:right}
.shop{display:flex;align-items:center;gap:12px}.shop .ic{font-size:36px;width:48px;text-align:center}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 14px}
.avs button{background:var(--card);border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;padding:8px 0;font-size:28px}
.avs button.on{border-color:var(--green)}.avs small{display:block;font-size:11px;color:var(--tx2);margin-top:2px}
.toast{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:11px 16px;border-radius:14px;z-index:99;font-weight:900;width:max-content;max-width:86%;font-size:15px;text-align:center;box-shadow:0 4px 0 var(--red-d);animation:drop .2s}
.toast.ok{background:var(--green);box-shadow:0 4px 0 var(--green-d)}@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.cf{position:absolute;top:-30px;font-size:22px;animation:fall 2.4s linear forwards;z-index:60;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:24px;gap:12px}
.big{font-size:80px;line-height:1}
.owl{animation:bob2 1.4s infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
label{display:block;margin:14px 0 6px;color:var(--tx2);font-size:14px}
.sk{background:linear-gradient(90deg,var(--soft),var(--bd),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px}
@keyframes sk{to{background-position:-200% 0}}
.toggle{width:52px;height:30px;border-radius:15px;background:var(--lock);position:relative;transition:background .2s;flex:none}
.toggle:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on{background:var(--green)}.toggle.on:after{left:25px}
.chart{width:100%;display:block}
.word{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--bd)}
.word button{font-size:20px}
</style>
<style id="liquid-glass">
/* ================= Liquid Glass (как в iOS) ================= */
:root{--bg:#EEF2F6;--tx:#1C2430;--tx2:#6B7785;--bd:rgba(20,40,60,.10);--soft:rgba(255,255,255,.55);--lock:rgba(120,135,150,.22);--lock-d:rgba(120,135,150,.30);
--glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.72);--gbd:rgba(255,255,255,.85);--ghl:rgba(255,255,255,.95);--gsh:0 10px 30px rgba(30,50,80,.12);
--bgimg:radial-gradient(55% 35% at 0% 0%,rgba(88,204,2,.35),transparent 70%),radial-gradient(50% 35% at 100% 18%,rgba(28,176,246,.38),transparent 70%),radial-gradient(60% 40% at 15% 70%,rgba(206,130,255,.30),transparent 70%),radial-gradient(50% 35% at 100% 100%,rgba(255,200,0,.28),transparent 70%)}
[data-theme=dark]{--bg:#0B1418;--tx:#F2F7FA;--tx2:#93A4AE;--bd:rgba(255,255,255,.10);--soft:rgba(255,255,255,.07);--lock:rgba(255,255,255,.10);--lock-d:rgba(255,255,255,.06);
--glass:rgba(255,255,255,.07);--glass2:rgba(30,45,52,.62);--gbd:rgba(255,255,255,.16);--ghl:rgba(255,255,255,.28);--gsh:0 12px 34px rgba(0,0,0,.40);
--bgimg:radial-gradient(55% 35% at 0% 0%,rgba(88,204,2,.26),transparent 70%),radial-gradient(50% 35% at 100% 18%,rgba(28,176,246,.28),transparent 70%),radial-gradient(60% 40% at 15% 70%,rgba(206,130,255,.22),transparent 70%),radial-gradient(50% 35% at 100% 100%,rgba(255,150,0,.18),transparent 70%)}
html,body{background:var(--bgimg),var(--bg);background-attachment:fixed}
#app{background:transparent}
.glass,.card,.stat,.opt,.chip,.seg,.chips button,.li.glassli,input,textarea,.avs button,.chap button,.word button{
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--gbd);box-shadow:inset 0 1px 0 var(--ghl),var(--gsh)}
.card,.stat{border-radius:24px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,0) 45%),var(--glass)}
/* плавающие панели */
.top{position:absolute;z-index:20;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;border:1px solid var(--gbd);border-radius:24px;padding:6px 8px;
  background:var(--glass2);-webkit-backdrop-filter:blur(26px) saturate(200%);backdrop-filter:blur(26px) saturate(200%);box-shadow:inset 0 1px 0 var(--ghl),var(--gsh)}
.pill{border-radius:16px}.pill:active{background:var(--soft)}
main{position:absolute;inset:0;padding:74px 0 calc(108px + env(safe-area-inset-bottom))}
nav{position:absolute;z-index:20;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border:1px solid var(--gbd);border-radius:30px;padding:6px;
  background:var(--glass2);-webkit-backdrop-filter:blur(26px) saturate(200%);backdrop-filter:blur(26px) saturate(200%);box-shadow:inset 0 1px 0 var(--ghl),var(--gsh)}
nav button{border-radius:24px;border:1px solid transparent;filter:saturate(.4);opacity:.8;transition:all .2s}
nav button.on{filter:none;opacity:1;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08));border-color:var(--gbd);box-shadow:inset 0 1px 0 var(--ghl),0 4px 14px rgba(28,176,246,.25)}
nav button.on small{color:var(--tx)}
/* кнопки — глянцевые капсулы */
.btn{border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.12),0 8px 20px rgba(88,204,2,.35);
  background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%),var(--green);letter-spacing:.3px;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.btn:active{transform:scale(.96);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 10px rgba(88,204,2,.25)}
.btn.blue{background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%),var(--blue);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 20px rgba(28,176,246,.35)}
.btn.red{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),var(--red);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px rgba(255,75,75,.35)}
.btn.ghost{background:var(--glass);color:var(--blue);border:1px solid var(--gbd);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 var(--ghl),var(--gsh)}
.btn[disabled]{background:var(--lock);color:var(--tx2);box-shadow:inset 0 1px 0 var(--ghl)}
input,textarea{border-radius:18px}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(28,176,246,.18)}
/* путь */
.unit{top:6px;border-radius:26px;border:1px solid rgba(255,255,255,.45);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 26px rgba(0,0,0,.18)}
.unit .ub{background:rgba(255,255,255,.28);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.chap:before,.chap:after{background:var(--bd)}
.chap button{border-radius:14px}
.node{box-shadow:none!important}
.node:not(.lock){background-image:radial-gradient(70% 55% at 35% 25%,rgba(255,255,255,.65),rgba(255,255,255,0) 60%)!important;
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.18),inset 0 2px 2px rgba(255,255,255,.6),0 10px 22px rgba(0,0,0,.25)!important;border:1px solid rgba(255,255,255,.5)}
.node.lock{background:var(--glass);border:1px solid var(--gbd);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 var(--ghl),var(--gsh)!important}
.node.cur{animation:pulse2 1.8s infinite}
@keyframes pulse2{0%,100%{outline:0 solid rgba(88,204,2,.45);outline-offset:0}50%{outline:10px solid rgba(88,204,2,0);outline-offset:4px}}
.nw.c{margin-top:52px}
.seg[style*=sticky]{background:var(--glass2)}
.tip{background:var(--glass2);border:1px solid var(--gbd);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:14px}
/* слои, шторки */
.layer{background:var(--bgimg),var(--bg)}
.sheet{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet>.sh{background:var(--glass2);-webkit-backdrop-filter:blur(34px) saturate(200%);backdrop-filter:blur(34px) saturate(200%);border:1px solid var(--gbd);border-bottom:0;
  border-radius:32px 32px 0 0;box-shadow:inset 0 1px 0 var(--ghl),0 -10px 40px rgba(0,0,0,.25)}
.grab{background:var(--tx2);opacity:.4}
.lhead{padding:12px 14px}
.bar{background:var(--glass);border:1px solid var(--gbd);height:18px;border-radius:12px}
.x{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--gbd);font-size:20px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.opt{border-radius:22px;border-bottom-width:1px}.opt .k{border-radius:10px;border:1px solid var(--gbd)}
.opt.sel{background:rgba(28,176,246,.18);border-color:rgba(28,176,246,.7)}
.opt.ok{background:rgba(88,204,2,.20);border-color:rgba(88,204,2,.75)}.opt.bad{background:rgba(255,75,75,.18);border-color:rgba(255,75,75,.75)}
.chip{border-radius:16px;border-bottom-width:1px}.chip.used{background:var(--lock);box-shadow:none;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.ans{background:repeating-linear-gradient(transparent 0 54px,var(--bd) 54px 56px)}
.foot{border-top:1px solid var(--gbd);background:var(--glass2);-webkit-backdrop-filter:blur(26px) saturate(200%);backdrop-filter:blur(26px) saturate(200%)}
.foot.ok{background:linear-gradient(0deg,rgba(88,204,2,.22),rgba(88,204,2,.12)),var(--glass2)}.foot.bad{background:linear-gradient(0deg,rgba(255,75,75,.22),rgba(255,75,75,.12)),var(--glass2)}
.say{border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--blue);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(28,176,246,.4)}
/* прочее */
.seg{border-radius:22px;padding:4px}.seg button{border-radius:18px;font-size:13px;padding:9px 2px}
.seg button.on{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.12));color:var(--tx);box-shadow:inset 0 1px 0 var(--ghl),0 4px 12px rgba(0,0,0,.12)}
.chips button{border-radius:16px}.chips button.on{background:rgba(28,176,246,.2);border-color:rgba(28,176,246,.6)}
.av{background:var(--glass);border:1px solid var(--gbd);box-shadow:inset 0 1px 0 var(--ghl)}
.xpb,.hb .tr{background:var(--lock)}
.li{border-bottom:1px solid var(--bd)}
.avs button{border-radius:20px;border-bottom-width:1px}
.toast{border-radius:999px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);background:rgba(255,75,75,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 24px rgba(0,0,0,.25)}
.toast.ok{background:rgba(70,170,0,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 24px rgba(0,0,0,.25)}
.toggle{background:var(--lock);box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}.toggle:after{box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sk{background:linear-gradient(90deg,var(--glass),var(--soft),var(--glass));background-size:200% 100%;border:1px solid var(--gbd);border-radius:24px}
.badge{border-radius:999px;padding:2px 9px}
.ann{display:flex;gap:12px;align-items:flex-start;border-color:rgba(255,200,0,.6)!important;background:linear-gradient(160deg,rgba(255,200,0,.22),rgba(255,200,0,.06)),var(--glass)!important}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--tx2);padding:10px 2px;border-radius:20px;background:var(--glass);border:1px solid var(--gbd);box-shadow:inset 0 1px 0 var(--ghl)}
.qa button span{font-size:24px}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.heat div{border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;border:1px solid var(--gbd)}
@media (prefers-reduced-transparency:reduce){.card,.stat,.top,nav,.sheet>.sh{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass2)}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="big owl">🦉</div><b>Teacher AJ</b></div></div>
<script>
// ================= Telegram: поведение мини-приложения =================
const tg = window.Telegram && Telegram.WebApp;
const inTG = !!(tg && tg.initData);
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
}
// запрет масштабирования и «резинки» страницы
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => { if (!/INPUT|TEXTAREA/.test(e.target.tagName)) e.preventDefault(); });

const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { user: null, tab: 'learn', dev: false, tg: {}, path: null, L: null };
const SET = { get sound() { return localStorage.getItem('sound') !== '0'; }, set sound(v) { localStorage.setItem('sound', v ? '1' : '0'); } };

// --- вибрация ---
const H = {
  tap() { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} },
  sel() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} },
  ok() { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} },
  err() { try { tg.HapticFeedback.notificationOccurred('error'); } catch (e) {} },
  warn() { try { tg.HapticFeedback.notificationOccurred('warning'); } catch (e) {} }
};
// --- кнопка «Назад» Telegram ---
const backStack = [];
function pushBack(fn) { backStack.push(fn); syncBack(); }
function popBack(fn) { const i = backStack.lastIndexOf(fn); if (i >= 0) backStack.splice(i, 1); syncBack(); }
function syncBack() { try { backStack.length ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }
function goBack() { const f = backStack[backStack.length - 1]; if (f) f(); }
try { tg.BackButton.onClick(goBack); } catch (e) {}
document.addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const bg = t === 'dark' ? '#0B1418' : '#EEF2F6';
  document.querySelector('meta[name=theme-color]').content = bg;
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); if (tg.setBottomBarColor) tg.setBottomBarColor(bg); } catch (e) {}
}
function toast(msg, ok) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast' + (ok ? ' ok' : ''); t.textContent = msg; app.appendChild(t); setTimeout(() => t.remove(), 2600); ok ? H.ok() : H.err(); }
function confetti() { let fx = $('#fx'); if (!fx) { fx = document.createElement('div'); fx.id = 'fx'; app.appendChild(fx); } const e = ['🎉', '⭐', '✨', '🔥', '💎', '🎊', '💚']; for (let i = 0; i < 42; i++) { const d = document.createElement('div'); d.className = 'cf'; d.textContent = e[i % e.length]; d.style.left = Math.random() * 100 + '%'; d.style.left = Math.random() * 92 + '%'; d.style.animationDelay = Math.random() * .7 + 's'; fx.appendChild(d); setTimeout(() => d.remove(), 3300); } }
let ac;
function sfx(kind) {
  if (!SET.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime;
    const notes = { ok: [[523, 0], [784, .09]], bad: [[220, 0], [180, .12]], win: [[523, 0], [659, .1], [784, .2], [1047, .3]] }[kind];
    for (const [f, d] of notes) { const o = ac.createOscillator(), g = ac.createGain(); o.type = kind === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.18, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .25); o.start(t + d); o.stop(t + d + .3); }
  } catch (e) {}
}
function speak(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .9; const v = speechSynthesis.getVoices().find(v => /^en(-|_)US/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const m = n % 10; return n > 10 && n < 20 ? c : m > 1 && m < 5 ? b : m === 1 ? a : c; };
function ago(day) {
  if (!day) return 'не заходил';
  const d = Math.round((new Date(new Date().toISOString().slice(0, 10)) - new Date(day)) / 864e5);
  return d <= 0 ? 'сегодня' : d === 1 ? 'вчера' : d + ' ' + plural(d, 'день', 'дня', 'дней') + ' назад';
}

// ================= Листы и слои =================
function openSheet(html, onClose) {
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = `<div class="sh"><div class="grab"></div>${html}</div>`;
  const close = () => { if (!sh.isConnected) return; sh.remove(); popBack(close); onClose && onClose(); };
  sh.onclick = e => { if (e.target === sh) close(); };
  // свайп вниз закрывает шторку
  const box = sh.firstChild; let y0 = null, dy = 0;
  box.addEventListener('touchstart', e => { if (box.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
  box.addEventListener('touchmove', e => { if (y0 === null) return; dy = e.touches[0].clientY - y0; if (dy > 0) box.style.transform = `translateY(${dy}px)`; }, { passive: true });
  box.addEventListener('touchend', () => { if (y0 === null) return; if (dy > 90) close(); else box.style.transform = ''; y0 = null; });
  app.appendChild(sh); pushBack(close); H.tap();
  sh.close = close; return sh;
}
function openLayer(cls) {
  const l = document.createElement('div'); l.className = 'layer ' + (cls || '');
  app.appendChild(l);
  const close = () => { if (!l.isConnected) return; l.remove(); popBack(close); };
  l.close = close; pushBack(close); return l;
}

// ================= Запуск =================
async function boot() {
  try {
    const [r] = await Promise.all([api('/me'), loadAdminKey()]);
    S.user = r.user; S.dev = r.dev; S.tg = r.tg;
  } catch (e) {
    return app.innerHTML = `<div class="center"><div class="big">📡</div><b>${esc(e.message)}</b><button class="btn tap" style="max-width:260px" onclick="location.reload()">Повторить</button></div>`;
  }
  applyTheme(S.user ? S.user.theme : (localStorage.getItem('theme') || 'dark'));
  api('/lessons-raw').then(L => S.L = L).catch(() => {});
  S.user ? shell() : register();
}

function register() {
  const t = S.tg || {};
  app.innerHTML = `<main class="view" style="padding:30px 22px">
    <div style="text-align:center"><div class="big owl">🦉</div><div class="h" style="margin:10px 0 4px">Добро пожаловать в Teacher AJ!</div>
    <div class="muted">300 уроков английского: от Starter до Upper-Intermediate</div></div>
    <label>Ник (латиницей)</label><input id="rn" value="${esc(t.username || '')}" placeholder="например, ali_2025" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="20">
    <label>Имя</label><input id="rf" value="${esc(t.first || '')}" placeholder="Имя" maxlength="40">
    <label>Фамилия</label><input id="rl" value="${esc(t.last || '')}" placeholder="Фамилия (необязательно)" maxlength="40">
    <div id="er" style="color:var(--red);min-height:22px;margin:10px 0"></div>
    <button class="btn" id="go">Начать учиться</button></main>`;
  const go = async () => {
    const n = $('#rn').value.trim().replace(/^@/, ''), b = $('#go');
    if (!/^[A-Za-z0-9_]{3,20}$/.test(n)) { $('#er').textContent = 'Ник: 3–20 символов, латинские буквы, цифры и _'; H.err(); return; }
    b.disabled = true;
    try {
      if (!inTG) localStorage.setItem('devUser', n);
      const r = await api('/register', { nick: n, first: $('#rf').value, last: $('#rl').value });
      S.user = r.user; applyTheme(S.user.theme); H.ok(); shell();
    } catch (e) { $('#er').textContent = e.message; if (!inTG) localStorage.removeItem('devUser'); b.disabled = false; H.err(); }
  };
  $('#go').onclick = go; $('#rl').onkeydown = e => { if (e.key === 'Enter') go(); };
}

// ================= Каркас =================
function tabs() {
  const t = [['learn', '🏠', 'Учёба'], ['tasks', '📝', 'Задания'], ['rank', '🏆', 'Рейтинг'], ['shop', '🛍️', 'Магазин'], ['me', '🦉', 'Профиль']];
  if (S.user.role === 'teacher') t.splice(4, 0, ['teach', '📊', 'Учитель']);
  return t;
}
function shell() {
  app.innerHTML = `<header class="top" id="top"></header><main id="main"></main><nav id="nav"></nav>`;
  renderTop(); renderNav(); go(S.tab, true);
}
function renderTop() {
  const u = S.user, el = $('#top'); if (!el) return;
  el.innerHTML = `<button class="pill tap" onclick="go('me')">🔥 <span style="color:var(--orange)">${u.streak}</span></button>
    <button class="pill tap" onclick="go('shop')">💎 <span style="color:var(--blue)">${u.gems}</span></button>
    <button class="pill tap" onclick="go('shop')">❤️ <span style="color:var(--red)">${u.role === 'teacher' ? '∞' : u.hearts}</span></button>
    <button class="pill tap" onclick="go('me')">⚡ <span style="color:var(--yellow)">${u.xp}</span>${u.boost_left > 0 ? '<span class="badge" style="margin-left:2px">x2</span>' : ''}</button>`;
}
function renderNav() { $('#nav').innerHTML = tabs().map(([k, i, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}" onclick="go('${k}')">${i}<small>${l}</small></button>`).join(''); }
const scrollMem = {};
function go(tab, force) {
  const main = $('#main'); if (!main) return;
  if (S.tab === tab && !force) { main.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (!force) scrollMem[S.tab] = main.scrollTop; S.tab = tab; H.sel();
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  ({ learn, tasks, rank, shop, me, teach })[tab]();
}
const V = (h, keepScroll) => { const m = $('#main'); if (!m) return; m.innerHTML = `<div class="view">${h}</div>`; if (!keepScroll) m.scrollTop = 0; };
const skel = n => Array.from({ length: n }, () => '<div class="sk" style="height:74px;margin:12px 14px"></div>').join('');
function setUser(u) { if (u) { S.user = u; renderTop(); } }
async function refreshMe() { try { const r = await api('/me'); setUser(r.user); } catch (e) {} }
function fail(e) { toast(e.message || 'Ошибка'); }

// ================= Путь уроков =================
async function learn() {
  const had = !!S.path; if (had) drawPath('restore'); else V(skel(6));
  api('/announcement').then(a => {
    const old = JSON.stringify(S.ann); S.ann = a;
    if (a && a.id && localStorage.getItem('annSeen') != a.id && !S.annShown && S.user.role !== 'teacher') {
      S.annShown = true;
      const sh = openSheet(`<div style="text-align:center"><div class="big">📢</div><div class="h2" style="margin:10px 0 4px">Объявление учителя</div><div class="muted">${a.at}</div></div><div class="card" style="margin:14px 0;white-space:pre-wrap;font-weight:600">${esc(a.text)}</div><button class="btn" id="ok">Понятно</button>`, () => { localStorage.setItem('annSeen', a.id); if (S.tab === 'learn' && S.path) drawPath('stay'); });
      sh.querySelector('#ok').onclick = () => sh.close();
    } else if (JSON.stringify(a) !== old && S.tab === 'learn' && S.path) drawPath('stay');
  }).catch(() => {});
  try { const p = await api('/lessons'); const changed = JSON.stringify(p) !== JSON.stringify(S.path); S.path = p; if (changed && S.tab === 'learn') drawPath(had ? 'stay' : 'restore'); }
  catch (e) { if (!S.path) V(`<div class="center"><div class="big">📡</div><b>${esc(e.message)}</b><button class="btn sm" onclick="learn()">Повторить</button></div>`); }
}
function drawPath(mode) {
  const d = S.path, teacher = S.user.role === 'teacher'; let h = '';
  const icons = ['📗', '📘', '🔁', '💬', '🏆'];
  if (S.ann && S.ann.id && localStorage.getItem('annSeen') != S.ann.id) h += `<div class="card ann"><span style="font-size:26px">📢</span><div class="grow"><b>Объявление учителя</b> <span class="muted">${S.ann.at}</span><div style="margin-top:4px;font-weight:600;white-space:pre-wrap">${esc(S.ann.text)}</div></div><button class="tap" style="font-size:18px;color:var(--tx2)" onclick="localStorage.setItem('annSeen',${S.ann.id});H.tap();drawPath('stay')">✕</button></div>`;
  for (const lv of d.levels) {
    const done = lv.chapters.reduce((a, c) => a + c.lessons.filter(l => l.stars).length, 0);
    h += `<div class="unit" style="background:${lv.color};${lv.id === 6 ? 'color:#3b2f00' : ''}"><div class="grow"><b>Уровень ${lv.id} · ${lv.name}</b><span>${lv.ru} · пройдено ${done} из 50</span></div><div class="ub">${['🌱', '🐣', '🚲', '🚀', '🏔️', '👑'][lv.id - 1]}</div></div>`;
    for (const ch of lv.chapters) {
      h += `<div class="chap"><span>Глава ${ch.n}: ${esc(ch.title)}</span><button class="tap" onclick="vocab(${lv.id},${ch.n})">📖 Слова</button></div>`;
      ch.lessons.forEach((l, i) => {
        const open = l.id <= d.next || teacher, cur = l.id === d.next && !l.stars;
        const off = Math.round(Math.sin((i + ch.n * 2) * 1.1) * 52);
        const style = l.stars ? 'background:var(--yellow);box-shadow:0 7px 0 var(--yellow-d)' : open ? `background:${lv.color};box-shadow:0 7px 0 rgba(0,0,0,.25)` : '';
        h += `<div class="nw ${cur ? 'c' : ''}" style="transform:translateX(${off}px)"><button id="L${l.id}" class="node ${open ? '' : 'lock'} ${cur ? 'cur' : ''}" style="${style}" onclick="lessonSheet(${l.id})">${cur ? '<span class="tip">НАЧАТЬ</span>' : ''}${open ? (l.stars ? '✔️' : icons[i]) : '🔒'}${l.stars ? `<span class="st">${'⭐'.repeat(l.stars)}</span>` : ''}</button></div>`;
      });
    }
  }
  h += `<div class="center" style="padding:30px"><div class="big">🎓</div><b>Конец курса</b><div class="muted">Пройдите все 300 уроков!</div></div>`;
  const m = $('#main'), y = m.scrollTop; V(h, true);
  if (mode === 'stay') m.scrollTop = y;
  else if (scrollMem.learn) m.scrollTop = scrollMem.learn;
  else { const el = $('#L' + d.next); if (el) m.scrollTop = Math.max(0, el.getBoundingClientRect().top - m.getBoundingClientRect().top + m.scrollTop - m.clientHeight / 2 + 40); }
}
function findLesson(id) { for (const lv of S.path.levels) for (const ch of lv.chapters) for (const l of ch.lessons) if (l.id === id) return { ...l, ch: ch.title, lv }; }
function lessonSheet(id) {
  const L = findLesson(id), teacher = S.user.role === 'teacher';
  if (id > S.path.next && !teacher) { H.warn(); return toast('🔒 Сначала пройдите предыдущие уроки'); }
  const kind = { words: 'Новые слова', review: 'Повторение и письмо', sentences: 'Составляем предложения', test: 'Проверка всей главы' }[L.kind];
  const sh = openSheet(`<div class="row"><div class="av" style="background:${L.lv.color};border:0;color:#fff">${['📗', '📘', '🔁', '💬', '🏆'][(id - 1) % 5]}</div><div class="grow"><div class="h2" style="margin:0">${esc(L.title)}</div><div class="muted">${esc(L.lv.name)} · ${esc(L.ch)}</div></div></div>
    <div class="card" style="margin:16px 0">${kind}<div class="muted" style="margin-top:4px">${L.stars ? 'Лучший результат: ' + '⭐'.repeat(L.stars) + ' · повтор даёт +5 ⚡' : 'Награда: до 25 ⚡ и до 5 💎'}</div></div>
    <button class="btn" id="st">${L.stars ? 'Повторить урок' : 'Начать урок'}</button>`);
  sh.querySelector('#st').onclick = () => { sh.close(); startLesson(id); };
}
function vocab(lv, ch) {
  if (!S.L) return toast('Загрузка… попробуйте ещё раз');
  const c = S.L.levels[lv - 1].chapters[ch - 1];
  const sh = openSheet(`<div class="h2">📖 ${esc(c.title)}</div><div class="muted" style="margin-bottom:6px">Нажмите 🔊, чтобы послушать</div>` +
    c.words.map(w => `<div class="word"><button class="tap" data-say="${esc(w.en)}">🔊</button><div class="grow"><b>${esc(w.en)}</b><div class="muted">${esc(w.ru)}</div></div></div>`).join(''));
  sh.querySelectorAll('[data-say]').forEach(b => b.onclick = () => { H.tap(); speak(b.dataset.say); });
}

// ================= Урок =================
let P = null;
const norm = s => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"«»]/g, '').replace(/\s+/g, ' ').trim();

function pick(i) { if (P.st !== 'ask') return; H.sel(); P.sel = i; P.layer.querySelectorAll('.opt').forEach((b, j) => b.classList.toggle('sel', i === j)); P.layer.querySelector('#chk').disabled = false; }
function tok(i) {

document.addEventListener('keydown', ev => {

async function check() {
  const e = P.cur; if (P.st !== 'ask' || P.sel === null) return; P.st = 'done';
  let ok, right, note = '';
  if (e.t === 'mcq') {
    ok = P.sel === e.a; right = e.opts[e.a];
    P.layer.querySelectorAll('.opt').forEach((b, j) => { b.classList.remove('sel'); if (j === e.a) b.classList.add('ok'); else if (j === P.sel) b.classList.add('bad'); });
  } else if (e.t === 'type') {
    const ti = P.layer.querySelector('#ti'), v = norm(ti.value), a = norm(e.a); right = e.a; ti.disabled = true;
    ok = v === a;
    if (!ok && a.length >= 5 && lev(v, a) === 1) { ok = true; note = `Опечатка! Правильно: ${e.a}`; }
  } else {
    right = e.a.join(' '); ok = norm(P.picked.map(i => e.words[i]).join(' ')) === norm(right);
  }
  if (ok) { sfx('ok'); H.ok(); P.q.shift(); P.done++; P.combo++; }
  else {
    sfx('bad'); H.err(); P.mistakes++; P.combo = 0; P.q.push(P.q.shift());
    P.layer.querySelector('#lb').classList.add('shake');
    if (S.user.role !== 'teacher') { S.user.hearts = Math.max(0, S.user.hearts - 1); api('/heart-lost', {}).then(r => setUser(r.user)).catch(() => {}); }
  }
  if (e.say) setTimeout(() => speak(e.say), 150);
  P.layer.querySelector('.bar i').style.width = Math.round(P.done / P.total * 100) + '%';
  P.layer.querySelector('.lhead b').textContent = '❤️ ' + hearts();
  const out = !ok && S.user.role !== 'teacher' && S.user.hearts <= 0;
  const f = P.layer.querySelector('#foot'); f.className = 'foot ' + (ok ? 'ok' : 'bad');
  const praise = ['Отлично! 🎉', 'Верно! 💪', 'Супер! ✨', 'Так держать! 🔥', 'Молодец! 🌟'][Math.floor(Math.random() * 5)];
  const sub = ok ? (note || (e.t !== 'mcq' || e.hint ? esc(e.say || '') : '')) : `Правильно: <b>${esc(right)}</b>${e.hint ? '<br>' + esc(e.hint) : ''}`;
  f.innerHTML = `<div class="fb">${ok ? praise : 'Неправильно'}</div><div class="fs">${sub}</div><button class="btn ${ok ? '' : 'red'}" id="nx">${out ? 'Далее' : 'Продолжить'}</button>`;
  f.querySelector('#nx').onclick = () => { H.tap(); if (out) { P.layer.close(); P = null; refreshMe(); noHearts(); } else nextEx(); };
}

function barsSvg(vals, labels, color, h = 150) {
  const W = 340, pad = 22, top = 18, n = vals.length, mx = Math.max(2, ...vals), bw = (W - pad) / n;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h + 34}" xmlns="http://www.w3.org/2000/svg">`;
  for (let k = 0; k <= 2; k++) { const y = top + (h - top) * k / 2; s += `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--bd)" stroke-dasharray="3 4"/><text x="0" y="${y + 4}" font-size="10" style="fill:var(--tx2)">${Math.round(mx * (1 - k / 2))}</text>`; }
  vals.forEach((v, i) => {
    const bh = v ? Math.max(4, (h - top) * v / mx) : 2, x = pad + i * bw + bw * .18, y = h - bh;
    s += `<rect x="${x}" y="${y}" width="${bw * .64}" height="${bh}" rx="5" style="fill:${v ? color : 'var(--bd)'}"><title>${labels[i]}: ${v}</title></rect>`;
    if (v && n <= 14) s += `<text x="${x + bw * .32}" y="${y - 4}" font-size="10" text-anchor="middle" style="fill:var(--tx)" font-weight="800">${v}</text>`;
    if ((n - 1 - i) % (n > 14 ? 4 : 3) === 0) s += `<text x="${x + bw * .32}" y="${h + 16}" font-size="10" text-anchor="middle" style="fill:var(--tx2)">${labels[i]}</text>`;
  });
  return s + '</svg>';
}

  lv.chapters.forEach((c, ci) => {
    const ids = [1, 2, 3, 4, 5].map(k => (TLV - 1) * 50 + ci * 5 + k), started = (by[ids[0]] || {}).n || 0, fin = (by[ids[4]] || {}).n || 0;
    const rated = ids.map(i => by[i]).filter(Boolean), avg = rated.length ? (rated.reduce((a, x) => a + x.avg * x.n, 0) / rated.reduce((a, x) => a + x.n, 0)).toFixed(1) : '—';
    h += `<div class="card"><div class="row"><b class="grow">Глава ${ci + 1}: ${esc(c.title)}</b><span class="badge s">⭐ ${avg}</span></div>
      <div class="muted">начали ${started} · закончили ${fin} из ${d.students} (${Math.round(fin / st * 100)}%)</div><div class="xpb"><i style="width:${Math.round(fin / st * 100)}%;background:var(--green)"></i></div>
      <div class="heat">${ids.map((id, k) => { const x = by[id]; return `<div style="background:${col(x && x.avg)}" title="${esc(lname(id))}"><b style="font-size:15px">${x ? x.n : 0}</b><br>${['Слова 1', 'Слова 2', 'Повтор', 'Фразы', 'Тест'][k]}${x ? `<br>⭐${x.avg}` : ''}</div>`; }).join('')}</div></div>`;
  });
  TB(h);
}
function annSheet() {
  const sh = openSheet(`<div class="h2">📢 Объявление для учеников</div><div class="muted">Появится наверху вкладки «Учёба» у всех учеников. Оставьте поле пустым, чтобы убрать объявление.</div>
    <textarea id="at" rows="4" maxlength="500" style="margin-top:12px" placeholder="Например: завтра в 18:00 контрольная по главе 3!">${esc(S.ann && S.ann.text || '')}</textarea>
    <button class="btn" style="margin-top:14px" id="ap">Опубликовать</button>`);
  sh.querySelector('#ap').onclick = async () => { try { const t = sh.querySelector('#at').value; await api('/admin/announce', { text: t }); S.ann = null; sh.close(); toast(t.trim() ? 'Объявление опубликовано 📢' : 'Объявление убрано', true); } catch (e) { fail(e); } };
}
function giftAll() {
  const sh = openSheet(`<div class="h2">🎁 Бонус всем ученикам</div><div class="muted">Каждый ученик получит кристаллы.</div><div class="chips" style="margin:12px 0 8px">${[5, 10, 20, 50].map(v => `<button data-g="${v}">${v} 💎</button>`).join('')}</div><input id="ga" type="number" inputmode="numeric" value="10"><button class="btn" style="margin-top:14px" id="gb">Выдать всем</button>`);
  sh.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { sh.querySelector('#ga').value = b.dataset.g; H.sel(); });
  sh.querySelector('#gb').onclick = async () => { try { const r = await api('/admin/gift-all', { gems: sh.querySelector('#ga').value }); sh.close(); S.usersAll = null; toast(`Выдано ${r.count} ${plural(r.count, 'ученику', 'ученикам', 'ученикам')} 🎁`, true); } catch (e) { fail(e); } };
}
async function copyList() {
  try {
    const us = (await api('/admin/users')).users.filter(u => u.role !== 'teacher');
    const txt = 'Ученики Teacher AJ (' + new Date().toLocaleDateString('ru-RU') + ')\n' + us.map((u, i) => `${i + 1}. ${u.first_name} ${u.last_name || ''} @${u.nick} — уроков ${u.lessons}, опыт ${u.xp}, серия ${u.streak}, был ${ago(u.last_day)}`).join('\n');
    const sh = openSheet(`<div class="h2">📋 Список учеников</div><div class="muted">${us.length} ${plural(us.length, 'ученик', 'ученика', 'учеников')}. Скопируйте и отправьте куда нужно.</div><textarea id="cl" rows="9" readonly style="margin-top:12px;font-size:13px">${esc(txt)}</textarea><button class="btn" style="margin-top:14px" id="cb">Скопировать</button>`);
    sh.querySelector('#cb').onclick = async () => { const ta = sh.querySelector('#cl'); try { await navigator.clipboard.writeText(txt); } catch (e) { ta.focus(); ta.select(); document.execCommand('copy'); } toast('Скопировано 📋', true); };
  } catch (e) { fail(e); }
}
async function tHw() {
  const [{ submissions: ss }, { tasks: ts }] = await Promise.all([api('/admin/submissions'), api('/admin/tasks')]);
  S.subs = ss; S.atasks = ts; if (S.tab !== 'teach' || TT !== 'hw') return;
  const nNew = ss.filter(s => s.status === 'new').length, list = ss.filter(s => SUBF === 'all' || (SUBF === 'new' ? s.status === 'new' : s.status === 'graded'));
  TB(`<div style="margin:12px 14px"><button class="btn" onclick="newTask()">➕ Новое задание</button></div>
    <div class="h" style="margin-top:8px">Ответы учеников</div>
    <div class="chips">${[['new', `Новые (${nNew})`], ['graded', 'Проверенные'], ['all', 'Все']].map(([k, l]) => `<button class="${SUBF === k ? 'on' : ''}" onclick="SUBF='${k}';H.sel();tHw()">${l}</button>`).join('')}</div>
    ${list.length ? list.map(s => `<div class="card tap" onclick="gradeSheet(${s.id})"><div class="row"><b class="grow ellip">${esc(s.first_name)} ${esc(s.last_name || '')}</b>${s.status === 'graded' ? `<span class="badge g">${s.score}/100</span>` : '<span class="badge">новый</span>'}</div><div class="muted">${esc(s.title)}</div><div style="margin-top:6px;font-weight:600" class="ellip">${esc(s.text)}</div></div>`).join('') : `<div class="muted" style="margin:10px 16px">${SUBF === 'new' ? '🎉 Все ответы проверены' : 'Пока пусто'}</div>`}
    <div class="h">Мои задания</div>
    ${ts.length ? ts.map(t => `<div class="card"><div class="row"><b class="grow">${esc(t.title)}</b><button class="tap" style="font-size:18px" onclick="delTask(${t.id})">🗑️</button></div><div class="muted">${t.created} · ⚡ ${t.xp} · ответов: ${t.answers}${t.pending ? ` · <span style="color:var(--orange)">новых: ${t.pending}</span>` : ''}</div></div>`).join('') : '<div class="muted" style="margin:10px 16px">Заданий пока нет</div>'}`);
}
function newTask() {
  const sh = openSheet(`<div class="h2">➕ Новое задание</div><label>Заголовок</label><input id="nt" maxlength="120" placeholder="Например: Напишите о своей семье"><label>Текст задания</label><textarea id="nb" rows="4" placeholder="Что нужно сделать?"></textarea><label>Максимум опыта ⚡</label><div class="chips" style="margin:0 0 8px">${[20, 50, 100].map(v => `<button data-x="${v}">${v}</button>`).join('')}</div><input id="nx" type="number" inputmode="numeric" value="50"><button class="btn" style="margin-top:14px" id="pb">Опубликовать</button>`);
  sh.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { sh.querySelector('#nx').value = b.dataset.x; H.sel(); });
  sh.querySelector('#pb').onclick = async () => { try { await api('/admin/task', { title: sh.querySelector('#nt').value, body: sh.querySelector('#nb').value, xp: sh.querySelector('#nx').value }); sh.close(); toast('Задание опубликовано ✅', true); tHw(); } catch (e) { fail(e); } };
}
function delTask(id) {
  const sh = openSheet(`<div class="h2">Удалить задание?</div><div class="muted">Ответы учеников на него тоже удалятся.</div><button class="btn red" style="margin-top:16px" id="d1">Удалить</button><button class="btn ghost" style="margin-top:12px" id="d2">Отмена</button>`);
  sh.querySelector('#d2').onclick = () => sh.close();
  sh.querySelector('#d1').onclick = async () => { try { await api('/admin/task-delete', { id }); sh.close(); toast('Удалено', true); tHw(); } catch (e) { fail(e); } };
}
function gradeSheet(id) {
  const s = S.subs.find(x => x.id === id);
  const sh = openSheet(`<div class="h2">${esc(s.title)}</div><div class="muted">${esc(s.first_name)} · @${esc(s.nick)}</div><div class="card" style="margin:12px 0;white-space:pre-wrap;font-weight:600;-webkit-user-select:text;user-select:text">${esc(s.text)}</div>
    <label>Оценка</label><div class="chips" style="margin:0 0 8px">${[100, 80, 60, 40, 20].map(v => `<button data-sc="${v}">${v}</button>`).join('')}</div><input id="sc" type="number" inputmode="numeric" value="${s.score ?? 100}">
    <label>Комментарий</label><input id="fb" value="${esc(s.feedback || '')}" placeholder="Молодец! / Обрати внимание на…"><button class="btn" style="margin-top:14px" id="gb">${s.status === 'graded' ? 'Обновить оценку' : 'Поставить оценку'}</button>`);
  sh.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => { sh.querySelector('#sc').value = b.dataset.sc; H.sel(); });
  sh.querySelector('#gb').onclick = async () => { try { const r = await api('/admin/grade', { id, score: sh.querySelector('#sc').value, feedback: sh.querySelector('#fb').value }); sh.close(); toast(r.award ? `Ученик получил +${r.award} ⚡` : 'Сохранено ✅', true); tHw(); } catch (e) { fail(e); } };
}
boot();
</script>
